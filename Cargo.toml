[workspace]
members = ["crates/zmcl-core"]
exclude = ["vendor/zconv", "vendor/zclap", "vendor/zgpui", "vendor/zi18n"]
resolver = "3"

[package]
name = "zmcl"
version = "0.1.4"
edition = "2024"
rust-version = "1.100"
description = "A small native Minecraft launcher built on Project Z"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zmcl"

[features]
default = ["gui"]
gui = ["dep:zgpui", "dep:zi18n"]

[dependencies]
zmcl-core = { path = "crates/zmcl-core", version = "=0.1.0" }
zclap = {  version = "=0.1.4", git = "https://github.com/LIghtJUNction/zclap.git"}
zgpui = {  version = "=0.1.5", default-features = false, features = ["native", "linux-software"], optional = true, git = "https://github.com/LIghtJUNction/zgpui.git"}
zi18n = {  version = "=0.1.0", default-features = false, optional = true, git = "https://github.com/LIghtJUNction/zi18n.git"}

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
