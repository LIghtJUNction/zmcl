[package]
name = "zmcl-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Small no_std Minecraft launch planning and integrity core for Project Z"
license = "MIT"
repository = "https://github.com/LIghtJUNction/zmcl"

[dependencies]
sha1 = { version = "=0.11.0", default-features = false }
